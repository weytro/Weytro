name: Build EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install AutoHotkey v2 (chocolatey)
        shell: pwsh
        run: |
          choco install autohotkey --version=2.0.11 -y --no-progress
          Write-Host "-- AutoHotkey install tree --"
          Get-ChildItem "C:\Program Files\AutoHotkey" -Recurse | Select-Object FullName

      - name: Locate compiler + base
        shell: pwsh
        run: |
          $ahkBase = (Get-ChildItem "C:\Program Files\AutoHotkey" -Filter "AutoHotkey64.exe" -Recurse -ErrorAction SilentlyContinue |
                      Select-Object -First 1).FullName
          if (-not $ahkBase) {
              $ahkBase = (Get-ChildItem "C:\Program Files\AutoHotkey" -Filter "AutoHotkey.exe" -Recurse -ErrorAction SilentlyContinue |
                          Select-Object -First 1).FullName
          }
          if (-not $ahkBase) { throw "Could not locate AutoHotkey base exe" }
          Write-Host "Base:    $ahkBase"

          $ahk2exe = (Get-ChildItem "C:\Program Files\AutoHotkey" -Filter "Ahk2Exe.exe" -Recurse -ErrorAction SilentlyContinue |
                      Select-Object -First 1).FullName
          if (-not $ahk2exe) { throw "Could not locate Ahk2Exe.exe" }
          Write-Host "Ahk2Exe: $ahk2exe"

          "AHK_BASE=$ahkBase" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AHK2EXE=$ahk2exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compile FortEditPro.ahk to FortEditPro.exe
        shell: pwsh
        run: |
          & "$env:AHK2EXE" /in FortEditPro.ahk /out FortEditPro.exe /base "$env:AHK_BASE"
          if (-not (Test-Path FortEditPro.exe)) { throw "Compile failed - no exe produced" }
          $size = (Get-Item FortEditPro.exe).Length / 1MB
          Write-Host ("Built FortEditPro.exe: {0:N2} MB" -f $size)

      - name: Upload FortEditPro.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortEditPro
          path: FortEditPro.exe
          if-no-files-found: error

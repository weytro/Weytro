name: Build EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  AHK_VERSION: "2.0.11"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 interpreter
        shell: pwsh
        run: |
          $url = "https://www.autohotkey.com/download/2.0/AutoHotkey_${env:AHK_VERSION}.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ahk.zip
          Expand-Archive -Path ahk.zip -DestinationPath ahk -Force
          Get-ChildItem ahk

      - name: Download Ahk2Exe compiler
        shell: pwsh
        run: |
          $url = "https://github.com/AutoHotkey/Ahk2Exe/releases/latest/download/Ahk2Exe.zip"
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile ahk2exe.zip
          Expand-Archive -Path ahk2exe.zip -DestinationPath ahk2exe -Force
          Get-ChildItem ahk2exe

      - name: Compile FortEditPro.ahk to FortEditPro.exe
        shell: pwsh
        run: |
          $ahk2exe = Resolve-Path .\ahk2exe\Ahk2Exe.exe
          $base    = Resolve-Path .\ahk\AutoHotkey64.exe
          Write-Host "Ahk2Exe:  $ahk2exe"
          Write-Host "Base:     $base"
          & $ahk2exe /in FortEditPro.ahk /out FortEditPro.exe /base $base
          if (-not (Test-Path FortEditPro.exe)) {
              throw "Compile failed - no exe produced"
          }
          $size = (Get-Item FortEditPro.exe).Length / 1MB
          Write-Host ("Built FortEditPro.exe: {0:N2} MB" -f $size)

      - name: Upload FortEditPro.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortEditPro
          path: FortEditPro.exe
          if-no-files-found: error

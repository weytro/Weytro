name: Build EXE

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download AutoHotkey v2 interpreter (github release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference    = "SilentlyContinue"
          $headers = @{ 'User-Agent' = 'weytro-ci'; 'Accept' = 'application/vnd.github+json' }

          $candidates = @(
              "https://api.github.com/repos/AutoHotkey/AutoHotkey_L/releases/latest",
              "https://api.github.com/repos/AutoHotkey/AutoHotkey/releases/latest",
              "https://api.github.com/repos/Lexikos/AutoHotkey_L/releases/latest"
          )
          $rel = $null
          foreach ($u in $candidates) {
              try {
                  Write-Host "Trying $u"
                  $rel = Invoke-RestMethod -Uri $u -Headers $headers -ErrorAction Stop
                  Write-Host "  ok, tag=$($rel.tag_name)"
                  break
              } catch {
                  Write-Host "  $($_.Exception.Message)"
              }
          }
          if (-not $rel) { throw "No AutoHotkey release endpoint responded" }

          $asset = $rel.assets |
              Where-Object { $_.name -match '\.zip$' -and $_.name -notmatch 'setup|Ahk2Exe|debug|Source' } |
              Select-Object -First 1
          if (-not $asset) { throw "No usable AHK zip asset found in $($rel.tag_name)" }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ahk.zip -UseBasicParsing
          New-Item -ItemType Directory -Path ahk -Force | Out-Null
          Expand-Archive ahk.zip -DestinationPath ahk -Force

      - name: Download Ahk2Exe compiler (github release)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference    = "SilentlyContinue"
          $headers = @{ 'User-Agent' = 'weytro-ci'; 'Accept' = 'application/vnd.github+json' }

          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/AutoHotkey/Ahk2Exe/releases/latest" -Headers $headers

          $asset = $rel.assets |
              Where-Object { $_.name -match '\.zip$' } |
              Select-Object -First 1
          if (-not $asset) { throw "No Ahk2Exe zip asset found" }

          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile ahk2exe.zip -UseBasicParsing
          New-Item -ItemType Directory -Path ahk2exe -Force | Out-Null
          Expand-Archive ahk2exe.zip -DestinationPath ahk2exe -Force

      - name: Locate compiler + base
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $ahk2exeCandidates = @(
              (Get-ChildItem ahk2exe -Filter "Ahk2Exe.exe" -Recurse -ErrorAction SilentlyContinue),
              (Get-ChildItem ahk       -Filter "Ahk2Exe.exe" -Recurse -ErrorAction SilentlyContinue)
          ) | Where-Object { $_ } | ForEach-Object { $_ }
          $ahk2exe = $ahk2exeCandidates | Select-Object -First 1
          if (-not $ahk2exe) { throw "Could not find Ahk2Exe.exe anywhere" }
          Write-Host "Ahk2Exe: $($ahk2exe.FullName)"

          $baseCandidates = @(
              (Get-ChildItem ahk -Filter "AutoHotkey64.exe" -Recurse -ErrorAction SilentlyContinue),
              (Get-ChildItem ahk -Filter "AutoHotkey32.exe" -Recurse -ErrorAction SilentlyContinue),
              (Get-ChildItem ahk -Filter "AutoHotkey.exe"   -Recurse -ErrorAction SilentlyContinue)
          ) | Where-Object { $_ } | ForEach-Object { $_ }
          $base = $baseCandidates | Select-Object -First 1
          if (-not $base) { throw "Could not find any AutoHotkey base exe" }
          Write-Host "Base:    $($base.FullName)"

          "AHK2EXE=$($ahk2exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "AHK_BASE=$($base.FullName)"   | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Compile FortEditPro.ahk to FortEditPro.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $args = @(
              "/in",   "FortEditPro.ahk",
              "/out",  "FortEditPro.exe",
              "/base", "$env:AHK_BASE"
          )
          Write-Host "Running: $env:AHK2EXE $($args -join ' ')"

          $p = Start-Process -FilePath "$env:AHK2EXE" `
                             -ArgumentList $args `
                             -Wait -NoNewWindow -PassThru
          Write-Host "Ahk2Exe exit code: $($p.ExitCode)"

          # Ahk2Exe sometimes flushes the exe just after exiting - give it a beat.
          $deadline = (Get-Date).AddSeconds(15)
          while (-not (Test-Path FortEditPro.exe) -and (Get-Date) -lt $deadline) {
              Start-Sleep -Milliseconds 500
          }

          if (-not (Test-Path FortEditPro.exe)) {
              throw "Compile failed - no exe produced (exit $($p.ExitCode))"
          }
          $size = (Get-Item FortEditPro.exe).Length / 1MB
          Write-Host ("Built FortEditPro.exe: {0:N2} MB" -f $size)

      - name: Upload FortEditPro.exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: FortEditPro
          path: FortEditPro.exe
          if-no-files-found: error

      - name: Publish as GitHub Release (one-click download)
        uses: softprops/action-gh-release@v2
        with:
          files: FortEditPro.exe
          tag_name: build-${{ github.run_number }}
          name: "FortEditPro build #${{ github.run_number }}"
          body: |
            Automated build from commit ${{ github.sha }}.

            Download `FortEditPro.exe` below - no install needed.
          fail_on_unmatched_files: true
          make_latest: "true"
